[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "labforge-backend"
version = "0.1.0"
description = "LabForge Guided Demo backend foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
