[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "labforge-backend"
version = "0.1.0"
description = "LabForge Guided Demo backend foundation"
requires-python = ">=3.12"
dependencies = [
    "dynamixel-sdk>=3.7,<4",
    "fastapi",
    "pydantic",
    "pyserial>=3.5,<4",
    "uvicorn",
]

[project.optional-dependencies]
sila2 = [
    "unitelabs-sila==0.13.0",
    "httpx>=0.28,<0.29",
    "cryptography>=46,<48",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
