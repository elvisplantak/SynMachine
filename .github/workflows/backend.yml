name: Backend, SiLA and XDL (fake devices)

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, XDL, SiLA and independent C# client
    # Same-repository PR commits already receive the push check; test forks on PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      LABFORGE_ARDUINO_PORT: ''
      LABFORGE_SF_BOTTOM_VALVE_PORT: ''

    steps:
      - name: Check out backend and workflow only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            backend
            .github

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/ci-constraints.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/tools/sila2-client/packages.lock.json

      - name: Install Python dependencies and check lint
        run: |
          python -m pip install -e '.[dev,sila2]' -c ci-constraints.txt
          python -m pip check
          python --version
          python -m ruff --version
          python -m ruff check .

      - name: Build independent SiLA client with locked dependencies
        run: |
          dotnet --version
          dotnet restore tools/sila2-client/SynMachine.SilaClient.csproj \
            --configfile tools/sila2-client/NuGet.Config --locked-mode
          dotnet build tools/sila2-client/SynMachine.SilaClient.csproj \
            --configuration Release --no-restore
          test -s tools/sila2-client/bin/Release/net10.0/SynMachine.SilaClient.dll
          printf 'SYNMACHINE_SILA_DOTNET=%s\n' "$(command -v dotnet)" >> "$GITHUB_ENV"
          printf 'SYNMACHINE_SILA_CLIENT_DLL=%s\n' \
            "$PWD/tools/sila2-client/bin/Release/net10.0/SynMachine.SilaClient.dll" >> "$GITHUB_ENV"

      - name: Run complete backend suite with fake devices
        id: tests
        run: |
          python -m pytest -q -ra --junitxml="$RUNNER_TEMP/backend-tests.xml" \
            -o junit_logging=no -o junit_log_passing_tests=false

      - name: Require complete SiLA and XDL coverage without skipped tests
        if: always() && !cancelled() && steps.tests.outcome != 'skipped'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ['RUNNER_TEMP']) / 'backend-tests.xml'
          cases = ET.parse(report).getroot().findall('.//testcase')
          sila_modules = {'tests.test_sila2', 'tests.test_sila2_access', 'tests.test_sila2_external_client'}
          required = sila_modules | {'tests.test_xdl'}
          present = {case.get('classname') for case in cases}
          skipped = sum(case.find('skipped') is not None for case in cases)
          failed = sum(case.find('failure') is not None or case.find('error') is not None for case in cases)
          sila = sum(case.get('classname') in sila_modules for case in cases)
          xdl = sum(case.get('classname') == 'tests.test_xdl' for case in cases)
          summary = f'Backend: {len(cases)} cases; SiLA: {sila}; XDL: {xdl}; failed: {failed}; skipped: {skipped}.\n'
          print(summary, end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          if not cases or required - present or skipped or failed:
              raise SystemExit('Incomplete or failed backend/SiLA/XDL verification; inspect the test report.')
          PY

      - name: Retain test report
        if: always() && !cancelled() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-report
          path: ${{ runner.temp }}/backend-tests.xml
          retention-days: 7
          if-no-files-found: ignore
