[platformio]
default_envs = megaatmega2560

[env]
lib_deps = bblanchon/ArduinoJson@6.21.6
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=1
    -DARDUINOJSON_ENABLE_NAN=0
    -DARDUINOJSON_ENABLE_INFINITY=0

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
test_ignore = test_*
build_src_filter = +<*> -<commissioning/>

[env:pin_discovery_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
test_ignore = test_*
build_src_filter = -<*> +<commissioning/>
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<protocol/> +<identity/> +<service/> +<actuator/> +<commissioning/PinDiscoveryController.cpp>
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -Werror
