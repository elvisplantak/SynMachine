[platformio]
default_envs = megaatmega2560

[env]
lib_deps = bblanchon/ArduinoJson@6.21.6
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=1
    -DARDUINOJSON_ENABLE_NAN=0
    -DARDUINOJSON_ENABLE_INFINITY=0

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
test_ignore = test_*
build_src_filter = +<*> -<commissioning/> -<column_diagnostic/>

[env:pin_discovery_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
test_ignore = test_*
build_src_filter = -<*> +<commissioning/>
build_flags =
    -Wall
    -Wextra

[env:mixer_pin_discovery_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
test_ignore = test_*
build_src_filter = -<*> +<commissioning/>
build_flags =
    -Wall
    -Wextra
    -DLABFORGE_PIN_DISCOVERY_PAIR_A_STEP=4
    -DLABFORGE_PIN_DISCOVERY_PAIR_A_DIRECTION=5
    -DLABFORGE_PIN_DISCOVERY_PAIR_B_STEP=6
    -DLABFORGE_PIN_DISCOVERY_PAIR_B_DIRECTION=7
    -DLABFORGE_PIN_DISCOVERY_MAXIMUM_PULSES=1600
    -DLABFORGE_PIN_DISCOVERY_PULSE_SPACING_MS=2

[env:column_diagnostic_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
test_ignore = test_*
build_src_filter = -<*> +<column_diagnostic/>
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<protocol/> +<identity/> +<service/> +<actuator/> +<commissioning/PinDiscoveryController.cpp>
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -Werror

[env:mixer_pin_discovery_native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_pin_discovery_controller
build_src_filter = +<commissioning/PinDiscoveryController.cpp>
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -Werror
    -DLABFORGE_PIN_DISCOVERY_PAIR_A_STEP=4
    -DLABFORGE_PIN_DISCOVERY_PAIR_A_DIRECTION=5
    -DLABFORGE_PIN_DISCOVERY_PAIR_B_STEP=6
    -DLABFORGE_PIN_DISCOVERY_PAIR_B_DIRECTION=7
    -DLABFORGE_PIN_DISCOVERY_MAXIMUM_PULSES=1600
    -DLABFORGE_MIXER_PIN_DISCOVERY_TEST=1
