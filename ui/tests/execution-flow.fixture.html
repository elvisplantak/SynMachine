<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Fake command-flow regression</title></head>
<body><div id="root"></div><pre id="result">pending</pre>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import App from "/src/App.tsx";
const scenario = new URL(location.href).searchParams.get("scenario");
const recipe = scenario === "flow-recipes";
const calls = [];
let failure = false, hang = false;
const status = { configured: true, busy: true, executing: true,
  operation: { operation_id: "owned", action: "RUN", run_id: "run" }, error: null,
  retained_owner_id: null, run_id: "run", automatic_resume_allowed: false, flow_activity: null };
const machine = { state: "BUSY", active_run_id: "run", interrupted_run_id: null, interrupted_maintenance_id: null,
  active_execution: { phase: "P1_TRANSFER_S_TO_REACTOR", start_committed_at: new Date().toISOString() }, active_maintenance: null };
const run = { run_id: "run", status: "RUNNING", phase: "P1_TRANSFER_S_TO_REACTOR", configuration: {}, execution_settings: {} };
if (recipe) Object.assign(run, { configuration: null, execution_settings: null, recipe_step_index: 0,
  recipe: { recipe_id: "saved", revision: 1, content_digest: "a".repeat(64), definition: { schema_version: 1, name: "Recipe flow test", description: "", sources: { B1: "Blue", B2: "Purple", S: "Water" }, steps: [{ kind: "ADD", source: "S", volume_ml: "2" }] } } });
window.fetch = async (url, options = {}) => {
  const path = new URL(url, location.href).pathname;
  calls.push({ path, method: options.method ?? "GET" });
  if ((options.method ?? "GET") !== "GET") throw new Error("Flow visualization sent a command");
  if (failure) throw new Error("Fake connection failure");
  if (hang === "late") {
    const snapshot = JSON.stringify(status);
    return new Promise(resolve => setTimeout(() => resolve(new Response(snapshot)), 1600));
  }
  if (hang) return new Promise((_, reject) => options.signal.addEventListener("abort", () => reject(new Error("Fake timeout")), { once: true }));
  let body;
  if (path.endsWith("/execution")) body = status;
  else if (path.endsWith("/machine")) body = machine;
  else if (path.endsWith("/events") || path.endsWith("/recipes")) body = [];
  else if (path.includes("/runs/")) body = run;
  else return new Response(JSON.stringify({ detail: "Fake Service unavailable" }), { status: 503 });
  return new Response(JSON.stringify(body));
};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const wait = async (check) => { const end = Date.now() + 6000; while (!check()) { if (Date.now() > end) throw new Error(`Timeout: ${document.body.innerText}`); await new Promise(r => setTimeout(r, 25)); } };
const button = text => [...document.querySelectorAll("button")].find(b => b.textContent.trim() === text);
const view = () => document.querySelector('[aria-label="Commanded process flow"]');
const active = () => [...view().querySelectorAll('.activePipe')].map(p => [p.dataset.segment, p.dataset.direction]);
const setFlow = (route, kind) => { status.flow_activity = { phase_execution_id: "phase", run_id: "run", operation_number: 2, operation_command_id: kind === "COLLECT" ? null : "command", route, kind }; };
const root = createRoot(document.getElementById("root"));
try {
  root.render(React.createElement(App));
  await wait(() => button(recipe ? "Recipes" : "Open backend execution"));
  button(recipe ? "Recipes" : "Open backend execution").click();
  await wait(() => view());
  await wait(() => view().textContent.includes("No active transfer"));
  assert(active().length === 0, "Default preview flow leaked into connected view");
  const paths = [
    ["S_TO_P1", "ASPIRATE", "s-v6", "forward", "v2-reactor", 3],
    ["B1_TO_P1", "ASPIRATE", "b1-v4", "forward", "b2-v4", 4],
    ["B2_TO_P1", "ASPIRATE", "b2-v4", "forward", "b1-v4", 4],
    ["P1_TO_REACTOR", "DISPENSE", "v1-p1", "reverse", "s-v6", 3],
    ["REACTOR_TO_P2", "ASPIRATE", "v3-p2", "forward", "v7-sf", 2],
    ["P2_TO_SF_TOP", "DISPENSE", "v3-p2", "reverse", "sf-v8", 3],
    ["SF_BOTTOM_TO_P2", "ASPIRATE", "v7-v8", "reverse", "v5-column", 4],
    ["P2_TO_COLUMN", "DISPENSE", "v3-p2", "reverse", "sf-v8", 5],
    ["COLUMN_TO_FRACTIONS", "COLLECT", "bottom-fractions", "forward", "v5-column", 2],
  ];
  for (const [route, kind, segment, direction, absent, count] of paths) {
    setFlow(route, kind);
    await wait(() => active().length === count && active().some(p => p[0] === segment && p[1] === direction));
    assert(!active().some(p => p[0] === absent), `Later or unrelated path lit: ${route}`);
    const path = view().querySelector(`[data-segment="${segment}"] .activePipeFlow`);
    assert(getComputedStyle(path).animationName === "flow", "Dash animation not running");
    assert(getComputedStyle(path).animationDirection === (direction === "reverse" ? "reverse" : "normal"), "Dash direction wrong");
    status.flow_activity = null;
    await wait(() => active().length === 0);
  }
  if (scenario === "flow-stale") {
    setFlow("S_TO_P1", "ASPIRATE"); await wait(() => active().length === 3);
    hang = true; const began = Date.now(); await wait(() => active().length === 0);
    assert(Date.now() - began < 1800, "Stalled read kept animating stale flow");
    assert(view().textContent.includes("unavailable"), "Stale flow not explained");
    hang = false; failure = true; await new Promise(r => setTimeout(r, 1200));
    assert(active().length === 0, "Connection error relit flow"); failure = false;
    await wait(() => active().length === 3);
    status.flow_activity.run_id = "foreign"; await wait(() => active().length === 0);
    setFlow("S_TO_P1", "ASPIRATE"); status.flow_activity.route = "UNKNOWN";
    await wait(() => view().textContent.includes("unavailable")); assert(active().length === 0, "Malformed route animated");
    setFlow("S_TO_P1", "ASPIRATE"); status.error = "Fake transport ambiguity";
    await new Promise(r => setTimeout(r, 300)); assert(active().length === 0, "Fault animates old path");
    status.error = null; status.busy = false; status.executing = false;
    await new Promise(r => setTimeout(r, 300)); assert(active().length === 0, "Idle animates old path");
    status.busy = true; status.executing = true;
    setFlow("S_TO_P1", "ASPIRATE"); await wait(() => active().length === 3);
    hang = "late";
    await wait(() => active().length === 0);
    status.flow_activity = null;
    await new Promise(r => setTimeout(r, 750));
    assert(active().length === 0, "Late response after timeout revived old flow");
    hang = false;
    delete status.flow_activity;
    await wait(() => view().textContent.includes("not available from this backend"));
    assert(active().length === 0, "Legacy response inferred a route from phase");
  } else {
    setFlow("S_TO_P1", "ASPIRATE"); await wait(() => active().length === 3);
    button(recipe ? "Back to home" : "Exit demo").click(); await wait(() => !view());
    button(recipe ? "Recipes" : "Open backend execution").click(); await wait(() => view() && active().length === 3);
    assert(view().textContent.includes("not measured"), "Commanded path implies sensed liquid flow");
    assert(!view().querySelector('.closedMark'), "Inactive symbolic valves claimed closed physical positions");
  }
  assert(calls.every(c => c.method === "GET"), "Visualization/navigation dispatched or replayed a command");
  document.getElementById("result").textContent = `PASS:${scenario}`;
} catch(error) { document.getElementById("result").textContent = `FAIL:${scenario}:${error.message}`; }
if (!new URL(location.href).searchParams.has("capture")) root.unmount();
</script></body></html>
